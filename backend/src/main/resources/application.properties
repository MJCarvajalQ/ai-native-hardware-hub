spring.application.name=hardware-hub-backend

spring.datasource.url=jdbc:sqlite:hardwarehub.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# No fallback default on purpose: this repo is public, so a hardcoded
# default admin password would be a real vulnerability (anyone reading the
# source would know it). Missing ADMIN_EMAIL/ADMIN_PASSWORD fails startup
# loudly instead of silently using a known, publicly-visible credential.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
