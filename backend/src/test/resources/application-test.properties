spring.datasource.url=jdbc:sqlite:target/test-hardwarehub.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Test-only values, not real secrets — overrides the required
# app.admin.email/password so tests never depend on the environment
# (local or CI) happening to have ADMIN_EMAIL/ADMIN_PASSWORD set.
app.admin.email=test-admin@example.com
app.admin.password=test-only-not-a-real-password
